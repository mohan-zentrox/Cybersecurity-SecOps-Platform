# Nginx config for the built Project Aegis console.
#
# Two things this must do, both of which the image was previously missing:
#
#   1. SPA history fallback. The console uses client-side routing, so a hard
#      reload of /alerts or a pasted /cases/12 link asks nginx for a file that
#      does not exist. `try_files ... /index.html` hands those back to the app.
#
#   2. Proxy /api to the backend. The API client uses a relative baseURL
#      ("/api/v1"), which Vite proxies in development. In the container there
#      is no Vite, so without this block every API call 404s against nginx and
#      the app looks broken while the backend is perfectly healthy.
#
# BACKEND_ORIGIN is substituted at container start (see docker-entrypoint.sh)
# so the same image works in compose, Kubernetes, or anywhere else.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Baseline security headers. The CSP is deliberately strict: the console
    # loads no third-party scripts, styles, fonts, or images.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached or
    # users keep loading a stale bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Vulnerability scan uploads are capped at 50 MiB by the API; allow
        # slightly more through so the API returns its own 413 with a useful
        # message rather than nginx rejecting the request opaquely.
        client_max_body_size 55m;
    }

    # Proxy the health endpoints too, so an external check can reach the API
    # through the same ingress the console uses.
    location = /healthz {
        proxy_pass ${BACKEND_ORIGIN}/healthz;
    }

    location = /readyz {
        proxy_pass ${BACKEND_ORIGIN}/readyz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
