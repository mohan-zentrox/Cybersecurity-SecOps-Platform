# Local dev stack. See docs/ARCHITECTURE.md for the "why" behind the queue
# and event-store abstractions referenced below.
#
#   * `redis` backs the Queue abstraction (app/services/queue.py) in its
#     RedisStreamQueue implementation, which uses consumer groups so an
#     ingest batch is acknowledged only after it has been durably written.
#     A future Kafka deployment would replace this service and implement
#     KafkaQueueAdapter against the same Queue interface — no application
#     code outside services/queue.py would need to change.
#   * `postgres` backs both the relational metadata tables AND, via the
#     PostgresJSONBEventStore repository implementation, the normalized
#     event store. A future OpenSearch/Elastic deployment would add an
#     `opensearch` service here and an OpenSearchEventStore implementing the
#     same EventStoreRepository interface (app/services/normalizer.py) —
#     callers (the rule engine, the API layer) would not need to change.
#   * `migrate` runs Alembic then seeds, and every other service waits for it
#     to finish. Without that ordering the API can come up against an empty
#     schema and nobody can log in.
#   * `worker` drains the ingest queue out-of-band. It only does real work
#     when INGEST_MODE=worker; with the default inline mode it idles.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    # Deliberately not published to the host. Every service that needs the
    # database reaches it over the compose network as `postgres:5432`, and
    # publishing 5432 collides with the local PostgreSQL that most developer
    # machines already run. For an interactive shell use:
    #   docker compose exec postgres psql -U aegis
    volumes:
      - aegis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Not published either, for the same reason: services reach it as
    # `redis:6379` on the compose network, and 6379 is commonly already
    # bound on a developer machine. For an interactive shell use:
    #   docker compose exec redis redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations, then seed users/rules/channels/controls.
  # Exits 0 when done; the API and worker wait on that.
  migrate:
    build: ./backend
    # migrate, backend and worker are the same image with different commands.
    # They must share an explicit tag: without one, compose builds the
    # identical ./backend context concurrently for each service and the three
    # exports race, failing with `image ... already exists` and aborting `up`.
    # With the tag it is built once and reused.
    image: aegis-backend:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:aegis@postgres:5432/aegis
      ENV: development
      LOG_JSON: "false"
    command: >
      sh -c "alembic upgrade head && python -m app.seed"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: aegis-backend:local  # shared with migrate/worker — see the note on `migrate`
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      ENV: development
      # "inline" processes each ingest request end to end (deterministic,
      # good for demos). Set to "worker" to hand off to the worker service.
      INGEST_MODE: inline
      SCHEDULER_ENABLED: "true"
    ports:
      # Defaults to 8000 so the README's documented URLs keep working. Set
      # API_PORT in .env if something else on the host already binds it.
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: ./backend
    image: aegis-backend:local  # shared with migrate/backend — see the note on `migrate`
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      ENV: development
      QUEUE_CONSUMER_NAME: worker-1
      # The worker never runs the scheduler: SLA sweeps and feed polls belong
      # to exactly one process, and that is the API container.
      SCHEDULER_ENABLED: "false"
    command: ["python", "-m", "app.worker"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports:
      # Defaults to 5173, the URL the README tells you to open. Set
      # CONSOLE_PORT in .env to move it.
      - "${CONSOLE_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  aegis_postgres_data:
