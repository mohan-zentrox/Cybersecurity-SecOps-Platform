name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    name: Backend lint, SAST/dependency scan, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: SAST (bandit)
        # Non-blocking placeholder: report findings without failing the build
        # until the team triages the initial baseline. Flip to a hard gate
        # once the backlog of findings is addressed.
        run: bandit -r app -ll || true

      - name: Dependency vulnerability scan (pip-audit)
        # Same rationale as bandit above — surfaced but non-blocking initially.
        run: pip-audit -r requirements.txt || true

      - name: Run tests (in-memory SQLite, no external services required)
        run: pytest --cov=app --cov-report=term-missing

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint || true

      - name: Type-check and build
        run: npm run build

  container-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t aegis-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t aegis-frontend:ci ./frontend
